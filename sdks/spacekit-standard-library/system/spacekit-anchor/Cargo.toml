[package]
name = "spacekit-anchor"
version = "0.1.0"
edition = "2021"
description = "SpaceKit Anchor — Anchor data on the blockchain"
readme = "README.md"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/sdks/spacekit-standard-library/system/spacekit-anchor"
[lib]
crate-type = ["cdylib"]

[dependencies]
spacekit-contract-sdk = { version = "0.1.0", path = "../../../spacekit-contract-sdk" }
wee_alloc = "0.4"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"

