[package]
name = "spacekit-paymaster"
version = "0.1.0"
edition = "2021"
description = "ERC-4337–inspired paymaster for sponsored agent execution on SpaceKit (complements x402)"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/sdks/spacekit-standard-library/payments/spacekit-paymaster"
[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4.5"
spacekit-contract-sdk = { version = "0.1.0", path = "../../../spacekit-contract-sdk" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
