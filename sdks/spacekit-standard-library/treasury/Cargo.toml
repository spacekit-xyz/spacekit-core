[package]
name = "spacekit-treasury"
version = "0.1.0"
edition = "2021"
description = "SpaceKit Treasury SKCL contract — M-of-N governed disbursement of a pre-funded pool. No mint authority."
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/sdks/spacekit-standard-library/treasury"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wee_alloc = "0.4.5"
spacekit-contract-sdk = { path = "../../spacekit-contract-sdk" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
