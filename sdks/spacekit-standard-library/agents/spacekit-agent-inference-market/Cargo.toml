[package]
name = "spacekit-agent-inference-market"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/sdks/spacekit-standard-library/agents/spacekit-agent-inference-market"
[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4.5"
spacekit-contract-sdk = { version = "0.1.0", path = "../../../spacekit-contract-sdk" }

[profile.dev]
panic = "abort"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
