[package]
name = "spacekit-agent-microgpt"
version = "0.1.0"
edition = "2021"
description = "Micro-GPT agent contract - uses microgpt_forward host primitive for next-token prediction"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/sdks/spacekit-standard-library/agents/spacekit-agent-microgpt"
[lib]
crate-type = ["cdylib"]

[dependencies]
spacekit-contract-sdk = { version = "0.1.0", path = "../../../spacekit-contract-sdk" }
wee_alloc = "0.4"
libm = "0.2"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
