[package]
name = "wasm-did"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for SpaceKit quantum DID signatures (SLH-DSA FIPS-205, from spacekit-primitives)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.108"
js-sys = "0.3.64"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
slh-dsa = "0.2.0-rc.4"
signature = "3.0.0-rc.10"
rand_core = { version = "0.10", default-features = false }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
