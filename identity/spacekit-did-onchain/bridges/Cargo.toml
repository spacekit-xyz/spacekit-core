[package]
name = "spacekit-did-bridges"
version = "0.1.0"
edition = "2021"
authors = ["SpaceKit Team"]
description = "EVM and Solana off-chain bridge helpers for SpaceKit quantum DIDs"
license = "Apache-2.0"
repository = "https://github.com/spacekit-xyz/spacekit-core"
readme = "../README.md"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/identity/spacekit-did-onchain/bridges"
[lib]
name = "spacekit_did_bridges"
path = "src/lib.rs"

[[example]]
name = "evm_integration"
path = "../examples/evm_integration.rs"

[[example]]
name = "solana_integration"
path = "../examples/solana_integration.rs"

[dependencies]
spacekit-did = { path = "../../spacekit-did" }
bs58 = "0.5.0"
chrono = { version = "0.4.41", features = ["serde"] }
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"

[dev-dependencies]
sha2 = "0.10.9"
