[package]
name = "spacekit-recovery"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/identity/spacekit-recovery"
[dependencies]
anyhow = "1.0.98"
candle-core = "0.9.1"
concrete = "0.2.1"
halo2_proofs = "0.3.0"
ndarray = { version = "0.16.1", features = ["serde"] }
opendp = "0.13.0"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["time"] }
sha2 = "0.10"
uuid = "1.17.0"

# spacekit-primitives
spacekit-primitives = { path = "../../foundation/spacekit-primitives" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }


[[example]]
name = "ai_enhanced_demo"
path = "examples/ai_enhanced_demo.rs"

[[example]]
name = "behavioral_demo"
path = "examples/behavioral_demo.rs"

[[example]]
name = "complete_recovery_demo"
path = "examples/complete_recovery_demo.rs"

[[example]]
name = "zkp_demo"
path = "examples/zkp_demo.rs"