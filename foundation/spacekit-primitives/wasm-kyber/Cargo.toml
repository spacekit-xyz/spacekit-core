[package]
name = "spacekit-kyber-wasm"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/foundation/spacekit-primitives/wasm-kyber"
[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
base64 = "0.22"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3.5"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
# getrandom 0.2 with js feature for wasm browser support
getrandom = { version = "0.2", features = ["js"] }
# Force pqcrypto-internals to use our patched version with getrandom 0.2
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"

[patch.crates-io]
pqcrypto-internals = { path = "../vendor/pqcrypto-internals" }
pqcrypto-kyber = { path = "../vendor/pqcrypto-kyber" }