<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SpaceKit Storage Node - Architecture Overview</title>
  <desc id="desc">Layered architecture diagram of the SpaceKit Storage Node: clients (Agent, CLI, browser) call HTTP/SSE/MCP into the Warp API layer, which routes through the unified Storage Facade. The facade coordinates relational, document, vector, full-text, repository (CAS+commits+refs), transaction, sandbox, idempotency, rate-limit, and change-feed subsystems. Persistence is encrypted JSON + WAL + encrypted backups + content-addressed blobs + change_log.jsonl. A libp2p panel covers gossipsub federation and cross-server routing. A quantum stack panel covers OQS Kyber1024 + AES-256-GCM envelopes and PQ server keypair management.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#11172a"/>
    </linearGradient>
    <linearGradient id="facadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f4f8b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1180" height="880" fill="url(#bgGrad)"/>

  <text x="590" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">SpaceKit Storage Node - Architecture Overview</text>
  <text x="590" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Quantum-resistant / Multi-model / Agent-ready</text>

  <!-- Clients row -->
  <g>
    <text x="40" y="105" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">CLIENTS</text>
    <g transform="translate(40, 120)">
      <rect width="220" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="110" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Agents (LLM / SDK)</text>
      <text x="110" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">HTTP | SSE | MCP (stdio)</text>
    </g>
    <g transform="translate(280, 120)">
      <rect width="220" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="110" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">spacekit CLI</text>
      <text x="110" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">repo | files | facts | status</text>
    </g>
    <g transform="translate(520, 120)">
      <rect width="220" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="110" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Browser / WASM</text>
      <text x="110" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">spacekit-js | blob adapter</text>
    </g>
    <g transform="translate(760, 120)">
      <rect width="220" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="110" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Cross-Service</text>
      <text x="110" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">compute | messaging | simulator</text>
    </g>
  </g>

  <line x1="150" y1="184" x2="150" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="184" x2="390" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="184" x2="630" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="184" x2="870" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HTTP API layer -->
  <g transform="translate(40, 220)">
    <rect width="940" height="78" rx="12" fill="url(#apiGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="26" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="2">HTTP API / WARP</text>
    <text x="20" y="50" fill="#e2e8f0" font-size="12">/files | /api/documents | /facts | /blobs | /api/transactions | /api/sandboxes | /api/changes (SSE) | /service | /api/users | /api/servers</text>
    <text x="20" y="68" fill="#cbd5e1" font-size="11">Authorization: DID  |  Idempotency-Key  |  X-Sandbox-Id  |  CORS  |  per-IP and per-DID rate limit</text>
  </g>

  <line x1="510" y1="298" x2="510" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage Facade (centerpiece) -->
  <g transform="translate(140, 340)">
    <rect width="740" height="86" rx="14" fill="url(#facadeGrad)" stroke="#a78bfa" stroke-width="2"/>
    <text x="20" y="30" fill="#fff" font-size="16" font-weight="700">Storage Facade</text>
    <text x="20" y="52" fill="#ede9fe" font-size="12">single seam every read/write goes through  -  runtime flag enable_real_transactions</text>
    <text x="20" y="72" fill="#ede9fe" font-size="12">routes: facade.transactions / sandboxes / idempotency / did_rate_limiter / change_feed</text>
  </g>

  <line x1="240" y1="426" x2="240" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="426" x2="430" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="426" x2="610" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="426" x2="790" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Coordinators row -->
  <g>
    <text x="40" y="460" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">COORDINATORS</text>
    <g transform="translate(140, 470)">
      <rect width="180" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">TransactionManager</text>
      <text x="90" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">Serializable + commit lock</text>
      <text x="90" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">apply / revert / trace / savepoints</text>
    </g>
    <g transform="translate(330, 470)">
      <rect width="180" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">SandboxManager</text>
      <text x="90" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">TTL / conflict policy / dry-run</text>
      <text x="90" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">quotas / journal / reaper</text>
    </g>
    <g transform="translate(520, 470)">
      <rect width="180" height="80" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="700">Idempotency / RateLimit</text>
      <text x="90" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">BLAKE3 fingerprint, in-flight wait</text>
      <text x="90" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">per-DID token bucket / 429+retry</text>
    </g>
    <g transform="translate(710, 470)">
      <rect width="180" height="80" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="700">ChangeFeed</text>
      <text x="90" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">monotonic seq / SSE / Last-Event-ID</text>
      <text x="90" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">disk JSONL / gossipsub fanout</text>
    </g>
  </g>

  <line x1="230" y1="550" x2="230" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="550" x2="420" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="550" x2="610" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="550" x2="800" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Subsystems row -->
  <g>
    <text x="40" y="590" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">DATA MODELS</text>
    <g transform="translate(140, 600)">
      <rect width="160" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Database</text>
      <text x="80" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">relational / users / files</text>
      <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">facts / grants / documents</text>
    </g>
    <g transform="translate(310, 600)">
      <rect width="160" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">VectorIndex</text>
      <text x="80" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">cosine similarity</text>
      <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">metadata filters</text>
    </g>
    <g transform="translate(480, 600)">
      <rect width="160" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">FullTextIndex</text>
      <text x="80" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">TF-IDF inverted</text>
      <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">tokenizer + stop words</text>
    </g>
    <g transform="translate(650, 600)">
      <rect width="160" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Repo / CAS</text>
      <text x="80" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">blobs / commits / refs</text>
      <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">spacekit-repo + spacekit-diff</text>
    </g>
    <g transform="translate(820, 600)">
      <rect width="160" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">FactPackage</text>
      <text x="80" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">SPHINCS+ verified</text>
      <text x="80" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">dependencies DAG</text>
    </g>
  </g>

  <line x1="220" y1="670" x2="220" y2="720" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="670" x2="560" y2="720" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="670" x2="900" y2="720" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Persistence row -->
  <g>
    <text x="40" y="710" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">PERSISTENCE</text>
    <g transform="translate(140, 720)">
      <rect width="840" height="76" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#e2e8f0" font-size="12" font-weight="600">data_dir/</text>
      <text x="20" y="46" fill="#94a3b8" font-size="11">database.json (encrypted) | WAL | backups/ | facts/ | blobs/ | server_keypair.enc | change_log.jsonl</text>
      <text x="20" y="64" fill="#94a3b8" font-size="11">AES-256-GCM at-rest | BLAKE3 integrity | backup rotation | automatic recovery</text>
    </g>
  </g>

  <!-- Side panels -->
  <g transform="translate(1000, 220)">
    <rect width="160" height="290" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="80" y="28" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="2">QUANTUM STACK</text>
    <text x="14" y="56" fill="#e2e8f0" font-size="11">- OQS Kyber1024</text>
    <text x="14" y="76" fill="#e2e8f0" font-size="11">- pqcrypto-kyber (WASM)</text>
    <text x="14" y="96" fill="#e2e8f0" font-size="11">- AES-256-GCM</text>
    <text x="14" y="116" fill="#e2e8f0" font-size="11">- Envelope encryption</text>
    <text x="14" y="136" fill="#e2e8f0" font-size="11">- KEM-wrapped headers</text>
    <text x="14" y="156" fill="#e2e8f0" font-size="11">- Streaming download</text>
    <text x="14" y="176" fill="#e2e8f0" font-size="11">- Server-key rotation</text>
    <text x="14" y="196" fill="#e2e8f0" font-size="11">- AWS Secrets Manager</text>
    <text x="14" y="216" fill="#e2e8f0" font-size="11">- KeyMaster recovery</text>
    <text x="14" y="236" fill="#e2e8f0" font-size="11">- SPHINCS+ signatures</text>
    <text x="14" y="256" fill="#e2e8f0" font-size="11">- DID-based ACL</text>
    <text x="14" y="276" fill="#e2e8f0" font-size="11">- Zero-knowledge keys</text>
  </g>

  <g transform="translate(1000, 540)">
    <rect width="160" height="256" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="80" y="28" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="2">LIBP2P / P2P</text>
    <text x="14" y="56" fill="#e2e8f0" font-size="11">- gossipsub topics</text>
    <text x="14" y="76" fill="#e2e8f0" font-size="11">- Kademlia DHT</text>
    <text x="14" y="96" fill="#e2e8f0" font-size="11">- mDNS discovery</text>
    <text x="14" y="116" fill="#e2e8f0" font-size="11">- Noise / Yamux / TCP</text>
    <text x="14" y="136" fill="#e2e8f0" font-size="11">- Cross-server routing</text>
    <text x="14" y="156" fill="#e2e8f0" font-size="11">- ServerRoutingManager</text>
    <text x="14" y="176" fill="#e2e8f0" font-size="11">- Topical replication</text>
    <text x="14" y="196" fill="#e2e8f0" font-size="11">- Federation hooks</text>
    <text x="14" y="216" fill="#e2e8f0" font-size="11">- spacekit/changes/v1</text>
    <text x="14" y="236" fill="#e2e8f0" font-size="11">  (planned)</text>
  </g>

  <text x="590" y="850" text-anchor="middle" fill="#64748b" font-size="11">src/storage_facade.rs / src/transaction.rs / src/sandbox.rs / src/idempotency.rs / src/change_feed.rs / src/mcp.rs / src/api/agentic_routes.rs</text>
</svg>
