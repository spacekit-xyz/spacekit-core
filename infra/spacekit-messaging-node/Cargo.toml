[package]
name = "spacekit-messaging-node"
version = "0.1.0"
edition = "2021"
description = "SpaceKit Network Messaging Node - Quantum-resistant P2P messaging services"
license = "MIT"

[lib]
name = "spacekit_messaging_node"
path = "src/lib.rs"

# Optional standalone binary
[[bin]]
name = "spacekit-messaging-node"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[[bin]]
name = "spacekit-messaging-http"
path = "src/bin/http_gateway.rs"
required-features = ["standalone"]

[dependencies]
# Core SpaceKit functionality
spacekit-primitives = { path = "../spacekit-primitives" }

# Alloy primitives
alloy-primitives = { version = "1.4.1", features = ["serde"] }

# Networking and async
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Cryptography
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
rand = "0.8"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ecies = "0.2.7"
oqs = { version = "0.9.0", features = ["vendored", "kyber"], optional = true }

# Embedded history store (lazy mmap reads + bounded cache)
redb = "2.4"
moka = { version = "0.12", features = ["sync"] }

# Networking - libp2p with full P2P features
libp2p = { version = "0.53", features = [
    "tokio", 
    "tcp", 
    "noise", 
    "yamux", 
    "gossipsub", 
    "mdns", 
    "kad",       # Kademlia DHT
    "identify",
    "ping",
    "macros"     # For NetworkBehaviour derive
] }

# Logging and error handling
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14"
uuid = { version = "1.0", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
spacekit-compressor = { version = "0.1.0", path = "../spacekit-ai/spacekit-compressor" }

[features]
default = []
quantum = ["spacekit-primitives/quantum", "oqs"]
standalone = ["clap", "quantum"]

[dev-dependencies]
tempfile = "3.0"

[dependencies.clap]
version = "4.0"
features = ["derive"]
optional = true 
