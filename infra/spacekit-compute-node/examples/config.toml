# SWTCH Compute Node Configuration Example
# This file demonstrates how to configure a quantum-resistant compute node
# integrated with the SWTCH platform

[identity]
# Node's Decentralized Identifier (DID)
did = "did:swtch:compute:node:example"

# KEM used when generating CLI keys (often Kyber1024); sizes are inferred from .hex files if mismatched
quantum_algorithm = "Kyber1024"

# Prefer SpaceKit CLI keys (~ expanded by standalone on Unix)
private_key_path = "~/.spacekit/keys/private_key.hex"
public_key_path = "~/.spacekit/keys/public_key.hex"

[compute]
# Node identifier for the compute service
node_did = "did:swtch:compute:node:example"

# Maximum CPU cores to allocate for compute tasks
max_cpu_cores = 8

# Maximum memory in MB to allocate for compute tasks
max_memory_mb = 16384

# Supported runtime environments
supported_runtimes = ["wasm", "gpu", "hybrid"]

# Default quantum-resistant algorithm for encrypting compute tasks
quantum_algorithm = "Kyber768"

# Enable GPU acceleration for compute tasks
enable_gpu = true

# Enable quantum-resistant encryption for all communications
enable_quantum_encryption = true

# SWTCH network endpoint for service registration
network_endpoint = "wss://testnet-rpc.swtch.network"

# Minimum stake required to operate the compute node
stake_amount = 10000

[network]
# Network name (testnet, mainnet, localhost)
name = "swtch-testnet"

# Network RPC endpoint
endpoint = "wss://testnet-rpc.swtch.network"

# P2P port for node-to-node communication
p2p_port = 9000

# RPC port for client API access (only bound when enable_http_api = true)
rpc_port = 8080

# Bind operator + SwtchVM HTTP on rpc_port. Set false for headless nodes (P2P only).
enable_http_api = true

# Bootstrap nodes for initial network connection
bootstrap_nodes = [
    "wss://bootstrap1.spacekit.xyz",
    "wss://bootstrap2.spacekit.xyz",
    "wss://bootstrap3.spacekit.xyz"
]

[security]
# Enable quantum-resistant encryption for all operations
quantum_encryption = true

# List of supported quantum-resistant algorithms
supported_algorithms = [
    "Kyber512",
    "Kyber768", 
    "Kyber1024",
    "NtruPrimeSntrup761",
    "FrodoKem1344Aes",
    "FrodoKem1344Shake",
    "ClassicMcEliece348864",
    "ClassicMcEliece460896",
    "BikeL1",
    "BikeL3"
]

# Default algorithm for new operations
default_algorithm = "Kyber768"

# Enable secure compute enclaves (if supported by hardware)
secure_enclaves = false

# Minimum security level required for accepting tasks
min_security_level = "high"

[token]
# SWTCH token contract address on the target network
# TODO: Add more than one token contract address and network support
contract_address = "0x742d35cc6cf138459f2dd82ee5b16b319b8b1234"

# Minimum stake required to operate the node
minimum_stake = 10000

# Service fee percentage charged to users (0.0 - 100.0)
service_fee_percent = 2.5

# Payment settlement interval in seconds
settlement_interval_seconds = 3600

# Token reward per compute unit
reward_per_compute_unit = 0.001

# Maximum daily token rewards
max_daily_rewards = 1000.0

[vpos]
# Enable VPoS (Verifiable Proof of Service) generation
enabled = true

# Proof generation interval in seconds
proof_interval_seconds = 300

# Minimum quality score to maintain service (0.0 - 1.0)
min_quality_score = 0.8

# Enable automatic proof submission to network
auto_submit_proofs = true

# Reputation score weight for service selection
reputation_weight = 0.7

# Service verification challenge frequency
challenge_frequency = 0.1

[api]
# HTTP API server configuration
host = "127.0.0.1"
port = 8080

# Enable CORS for web applications
enable_cors = true

# Allowed CORS origins
cors_origins = ["http://localhost:3000", "https://app.swtch.network"]

# API rate limiting (requests per minute)
rate_limit = 1000

# Enable API authentication
require_auth = true

# API key for authentication (set via environment variable)
# api_key = "${SWTCH_API_KEY}"

# Token Reward Configuration
[token_reward_config]
# Base reward per compute unit (in SWTCH tokens, not wei)
base_reward_per_unit = 0.001

# Runtime multipliers for different execution environments
gpu_multiplier = 2.0        # GPU tasks get 2x reward
hybrid_multiplier = 1.5     # Hybrid tasks get 1.5x reward  
cpu_multiplier = 1.0        # CPU tasks get base reward

# Bonus multipliers
quantum_bonus = 1.2                  # 20% bonus for quantum encryption
max_efficiency_bonus = 2.0           # Up to 2x bonus for high efficiency
min_efficiency_penalty = 0.5         # Minimum 0.5x reward (even for inefficient tasks)

# Daily limits and controls
max_daily_rewards = 100.0            # 100 SWTCH max per day
enable_token_minting = true          # Enable actual token minting

# 🚀 NEW: Sigmoid Bonding Curve Configuration
[sigmoid_bonding_curve]
# Enable/disable sigmoid bonding curve pricing
enabled = true

# Mathematical parameters for P = k * [1 / (1 + e^(-a * (U - 0.5)))]
scaling_constant = 10.0              # Maximum price (k parameter) - 10 SWTCH
steepness = 5.0                      # Curve steepness (a parameter) - moderate
min_price = 0.1                      # Minimum floor price - 0.1 SWTCH
max_price = 10.0                     # Maximum ceiling price - 10 SWTCH

# Price adjustment controls
price_update_interval = 300          # Update pricing every 5 minutes (seconds)
price_smoothing_factor = 0.2         # 20% smoothing to prevent price volatility

# Utilization weights for network utilization calculation
[sigmoid_bonding_curve.utilization_weights]
gpu_weight = 0.3                     # 30% weight for GPU utilization
storage_weight = 0.2                 # 20% weight for storage utilization  
network_weight = 0.2                 # 20% weight for network bandwidth
compute_weight = 0.2                 # 20% weight for compute capacity
memory_weight = 0.1                  # 10% weight for memory usage

[gpu]
# Enable GPU compute acceleration
enabled = true

# Preferred GPU backend (webgpu, cuda, opencl, auto)
preferred_backend = "auto"

# Maximum GPU memory allocation in MB
max_gpu_memory_mb = 8192

# GPU utilization target percentage
target_utilization = 80.0

# Enable GPU memory optimization
memory_optimization = true

[wcvm]
# WebAssembly Compute Virtual Machine settings
enabled = true

# Default gas limit for WASM execution
default_gas_limit = 1000000

# Gas price in wei per unit
gas_price = 1000000000

# Maximum WASM module size in bytes
max_module_size = 16777216

# Enable WASM component model
component_model = true

# Cranelift optimization level (none, speed, speed_and_size)
optimization_level = "speed"

[monitoring]
# Enable metrics collection
enabled = true

# Metrics collection interval in seconds
interval_seconds = 30

# Prometheus metrics endpoint
prometheus_endpoint = "http://127.0.0.1:9090"

# Enable health checks
health_checks = true

# Health check interval in seconds
health_check_interval = 60

# Enable performance monitoring
performance_monitoring = true

[logging]
# Log level (trace, debug, info, warn, error)
level = "info"

# Log format (json, pretty)
format = "pretty"

# Enable file logging
file_logging = true

# Log file path
log_file = "./logs/compute-node.log"

# Maximum log file size in MB
max_log_size_mb = 100

# Number of log files to retain
log_retention = 10

[storage]
# Enable local task storage
enabled = true

# Database type (sqlite, postgres, memory)
database_type = "sqlite"

# Database connection string
database_url = "./data/compute-node.db"

# Maximum stored tasks
max_stored_tasks = 10000

# Task retention period in days
task_retention_days = 30

# Enable task result caching
enable_caching = true

[development]
# Enable development mode features
dev_mode = false

# Enable debug endpoints
debug_endpoints = false

# Enable test mode (allows unsigned tasks)
test_mode = false

# Mock network responses for testing
mock_network = false

# Enable experimental features
experimental_features = false

# Development network endpoints
dev_endpoints = [
    "ws://localhost:9944",
    "http://localhost:8545"
] 