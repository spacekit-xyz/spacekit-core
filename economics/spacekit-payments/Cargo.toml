[package]
name = "spacekit-payments"
version = "0.1.0"
edition = "2021"
description = "SpaceKit payments in ASTRA: on-chain payment verification, pay-per-request gating and fee routing"
license = "Apache-2.0"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/economics/spacekit-payments"
[features]
default = ["warp-middleware"]
warp-middleware = ["dep:warp"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# HTTP middleware (optional, for compute-node integration)
warp = { version = "0.3", optional = true }
