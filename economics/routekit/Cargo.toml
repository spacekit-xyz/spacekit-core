[package]
name = "routekit"
version = "0.1.0"
edition = "2021"
description = "AI model routing relay — one endpoint, every model, automatic failover"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/economics/routekit"
[features]
default = ["complete"]
complete = []
intent = [
    "dep:ed25519-dalek",
    "dep:k256",
    "dep:sha3",
    "dep:spacekit-primitives",
]
vault = ["intent", "dep:alloy"]

[dependencies]
axum = { version = "0.7", features = ["json", "macros", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "limit", "request-id", "timeout", "trace"] }
tower = { version = "0.5", features = ["limit", "util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
tokio-stream = { version = "0.1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
sha2 = "0.10"
subtle = "2"
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
sha3 = { version = "0.10", optional = true }
spacekit-primitives = { path = "../../foundation/spacekit-primitives", default-features = false, features = ["secrets-core"], optional = true }
alloy = { version = "1.6", default-features = false, optional = true, features = [
    "provider-http",
    "signer-local",
    "contract",
    "rpc-types",
    "network",
    "reqwest",
] }

[dev-dependencies]
http-body-util = "0.1"
rand = "0.8"
