[package]
name = "spacekit-quantum-verkle-wasm"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/spacekit-xyz/spacekit-core"
homepage = "https://github.com/spacekit-xyz/spacekit-core/tree/main/data/spacekit-quantum-verkle/wasm-quantum-verkle"

# Standalone wasm32 build target — detached from the spacekit-core workspace
# (../../../Cargo.toml), which does not list this cdylib as a member. The
# path dependency on the parent crate below still resolves across the boundary.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.108"
js-sys = "0.3.64"
spacekit-quantum-verkle = { path = "..", package = "spacekit-quantum-verkle-tree" }
alloy-primitives = "1.0"
