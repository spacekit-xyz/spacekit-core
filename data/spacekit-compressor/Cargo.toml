[package]
name = "spacekit-compressor"
version = "0.1.0"
edition = "2021"
description = "SpaceKit Pattern Compression - Rust port of SpaceKit Compressor for high-performance text compression"
license = "MIT"

[lib]
name = "spacekit_compressor"
path = "src/lib.rs"

[dependencies]
# Compression
flate2 = "1.0"
lzma-rs = "0.3"
lazy_static = "1.4"

# Error handling
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"

[[bench]]
name = "compression"
harness = false
