[package]
name = "spacekit-memsearcher"
version = "0.1.0"
edition = "2021"
authors = ["SWTCH Labs <info@spacekit.xyz>"]
description = "Efficient LLM agent with compact memory management inspired by MemSearcher"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"

# Optional dependencies for web integration
axum = { version = "0.7", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
axum-example = ["axum"]

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "comparison"
path = "examples/comparison.rs"

[[example]]
name = "web_integration"
path = "examples/web_integration.rs"
required-features = ["axum-example"]

[lib]
name = "memsearcher"
path = "src/lib.rs"
